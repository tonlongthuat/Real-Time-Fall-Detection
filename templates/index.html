<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fall Detection</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
      body {
        background-color: #cdf3f1;
        font-family: Arial, sans-serif;
        text-align: center;
      }
      .image-container {
        position: relative;
        display: inline-block;
        border: 3px solid #000000;
        margin-top: 20px;
      }
      .Cam {
        width: 800px;
        height: 600px;
      }
      .controls {
        margin-top: 15px;
        display: flex;
        justify-content: center;
        gap: 10px;
      }
      button {
        padding: 8px 12px;
        font-size: 14px;
        cursor: pointer;
        border: none;
        background-color: #007bff;
        color: white;
        border-radius: 5px;
      }
      button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <h1>Fall Detection Demo</h1>
    <div class="image-container">
      <img
        id="video-preview"
        class="Cam"
        src="https://th.bing.com/th?q=No+Camera+Icon+White+PNG&w=120&h=120&c=1&rs=1&qlt=90&cb=1&dpr=1.5&pid=InlineBlock&mkt=en-WW&cc=VN&setlang=en&adlt=strict&t=1&mw=247"
        alt="Camera Preview"
      />
    </div>
    <div class="controls">
      <input id="file-input" type="file" accept="video/*" />
      <button onclick="uploadVideo()">Upload</button>
      <button onclick="chooseIpCam()">Choose IP Cam</button>
      <button onclick="closeCamera()">Close Cam</button>
    </div>

    <script>
      function uploadVideo() {
        const fileInput = document.getElementById("file-input");
        if (!fileInput.files.length) {
          alert("Please select a file first!");
          return;
        }
        const file = fileInput.files[0];
        const formData = new FormData();
        formData.append("file", file);

        $.ajax({
          url: "/upload",
          type: "POST",
          data: formData,
          contentType: false,
          processData: false,
          success: function () {
            document.getElementById("video-preview").src = "/video_feed";
          },
          error: function (xhr) {
            alert("Upload failed: " + (xhr.responseJSON?.error || "Unknown error"));
          },
        });
      }

      function chooseIpCam() {
        const ip = prompt("Please enter the IP address of the camera:")
        if (ip) {
          fetch("/set_ip", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ ip: ip }),
          })
            .then((response) => response.json())
            .then((data) => {
              alert(data.message)
              document.getElementById("video-preview").src = "/video_feed"
            })
            .catch((error) => {
              console.error("Error:", error)
            })
        }
      }

      function closeCamera() {
        fetch("/close_cam", { method: "POST" }) // Gửi yêu cầu đến server để dừng luồng video
          .then(() => {
            document.getElementById("video-preview").src =
              "https://th.bing.com/th?q=No+Camera+Icon+White+PNG&w=120&h=120&c=1&rs=1&qlt=90&cb=1&dpr=1.5&pid=InlineBlock&mkt=en-WW&cc=VN&setlang=en&adlt=strict&t=1&mw=247";
          })
          .catch(() => alert("Failed to close camera!"));
      }
    </script>
  </body>
</html>
