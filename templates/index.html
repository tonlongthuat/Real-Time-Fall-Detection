<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fall Detection</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
      body {
        background-color: #cdf3f1;
        font-family: Arial, sans-serif;
        text-align: center;
      }
      .image-container {
        position: relative;
        display: inline-block;
        border: 3px solid #000000;
        margin-top: 20px;
      }
      .Cam {
        width: 800px; /* Increased width */
        height: 600px; /* Increased height */
      }
      .dropdown {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Fall Detection Demo</h1>
    <div class="image-container">
      <img
        id="video-preview"
        class="Cam"
        src="https://th.bing.com/th?q=No+Camera+Icon+White+PNG&w=120&h=120&c=1&rs=1&qlt=90&cb=1&dpr=1.5&pid=InlineBlock&mkt=en-WW&cc=VN&setlang=en&adlt=strict&t=1&mw=247"
        alt="Camera Preview"
      />
    </div>
    <div class="dropdown">
      <label for="file-input">Choose File:</label>
      <input
        id="file-input"
        type="file"
        name="file"
        accept="video/*"
        onchange="uploadVideo(event)"
      />
      <button onclick="chooseIpCam()">Choose IP Cam</button>
      <button onclick="closeCamera()">Close Cam</button>
    </div>
    <script>
      function uploadVideo(event) {
        const file = event.target.files[0]
        if (file) {
          const formData = new FormData()
          formData.append("file", file)

          $.ajax({
            url: "/upload", // Ensure this matches the Flask route
            type: "POST",
            data: formData,
            contentType: false,
            processData: false,
            success: function (response) {
              alert(response.message)
              document.getElementById("video-preview").src = "/video_feed"
            },
            error: function (xhr) {
              alert("Error: " + xhr.responseJSON.error)
              console.error("Error:", xhr.responseJSON.error)
            },
          })
        }
      }

      function chooseIpCam() {
        const ip = prompt("Please enter the IP address of the camera:")
        if (ip) {
          fetch("/set_ip", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ ip: ip }),
          })
            .then((response) => response.json())
            .then((data) => {
              alert(data.message)
              document.getElementById("video-preview").src = "/video_feed"
            })
            .catch((error) => {
              console.error("Error:", error)
            })
        }
      }

      function closeCamera() {
        document.getElementById("video-preview").src =
          "https://th.bing.com/th?q=No+Camera+Icon+White+PNG&w=120&h=120&c=1&rs=1&qlt=90&cb=1&dpr=1.5&pid=InlineBlock&mkt=en-WW&cc=VN&setlang=en&adlt=strict&t=1&mw=247"
      }
    </script>
  </body>
</html>
